name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deno check, compile, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Validate model sync script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "./scripts/sync-commandcode-models.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host "PowerShell syntax ok"

      - name: Check formatting
        # Directories, not a hand-written file list.
        #
        # The list this replaced named 27 paths and left out every file added
        # after it was written - which is how src/cnb.ts accumulated 591 lines of
        # formatting drift and then dumped it into a feature commit, making that
        # diff unreviewable. A list of paths cannot stay correct as a tree grows;
        # a directory can. `deno fmt --check` skips files it has no business
        # formatting (the lockfile, vendored copies) on its own.
        run: deno fmt --check main.ts worker.ts src scripts

      - name: Type-check and build-check
        run: deno task check

      - name: Check manual smoke probe
        run: deno check scripts/probes/commandcode-smoke.ts

      - name: Check DSH bridge self-test
        run: |
          node --check dsh-plugin/index.js
          node --check dsh-plugin/client.js
          node --check dsh-plugin/stats.mjs
          node dsh-plugin/self-test.mjs
          node --test dsh-plugin/stats.test.mjs

      - name: Compile executable
        run: deno compile --allow-env --allow-net --output ./ai-proxy-ci main.ts

      - name: Lint shared runtime, CommandCode, Zen, and Responses modules
        run: deno lint src/runtime src/commandcode src/zen.ts src/zen-compaction.ts src/zen-egress.ts src/deepseek-responses.ts src/zen-catalog.ts

      - name: Run tests
        run: deno task test
